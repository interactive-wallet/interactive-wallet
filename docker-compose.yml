services:
  mediator:
    image: mediator
    build:
      context: ./mediator/
      dockerfile: ../scripts/Dockerfile
      args:
        - DOCKER_BUILDKIT=1

    environment:
      MEDIATOR_DOMAIN: mediator # same as service name
      MEDIATOR_WALLET_ID: Mediator
      MEDIATOR_SEED: Mediator_00000000000000000000000
      MEDIATOR_HTTP_PORT: 3007
      MEDIATOR_WS_PORT: 3008
      MEDIATOR_API_PORT: 3006
      VON_URL: http://host.docker.internal:9000

    ports:
      - "127.0.0.1:3006:3006"
      - "127.0.0.1:3007:3007"
      - "127.0.0.1:3008:3008"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  wallet:
    image: wallet-agent
    build:
      context: ./wallet-agent/
      dockerfile: ../scripts/Dockerfile
      args:
        - DOCKER_BUILDKIT=1

    environment:
      AGENT_ROLE: holder
      AGENT_LABEL: interactive-holder-agent

      WALLET_DOMAIN: wallet
      WALLET_ID: Holder
      WALLET_KEY: holder-wallet-key-change-in-prod
      WALLET_API_PORT: 3000

      MEDIATOR_API_URL: http://mediator:3006

      HOLDER_ID: wallet

      VON_URL: http://host.docker.internal:9000
      INDY_NAMESPACE: local:test
      ISSUER_API_URL: http://issuer:3002

      RABBITMQ_URL: amqp://rabbitmq_walletApp:1234@rabbitmq:5672/ssi
      ISSUER_ROUTING_ID: fuehrerscheinstelle
      CREDENTIAL_TYPE: drivers-license

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      rabbitmq:
        condition: service_healthy
      mediator:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - holder-data:/app/data

  verifier:
    image: wallet-agent
    build:
      context: ./wallet-agent/
      dockerfile: ../scripts/Dockerfile
      args:
        - DOCKER_BUILDKIT=1

    environment:
      AGENT_ROLE: verifier
      AGENT_LABEL: interactive-verifier-agent

      WALLET_DOMAIN: verifier
      AGENT_ENDPOINT: http://verifier:3005
      INBOUND_PORT: 3005

      WALLET_ID: Verifier
      WALLET_KEY: verifier-wallet-key-change-in-prod
      WALLET_API_PORT: 3004

      VERIFIER_SEED: Verifier_00000000000000000000000
      VERIFIER_ID: autovermietung

      VON_URL: http://host.docker.internal:9000
      INDY_NAMESPACE: local:test
      ISSUER_API_URL: http://issuer:3002

      RABBITMQ_URL: amqp://rabbitmq_walletApp:1234@rabbitmq:5672/ssi
      ISSUER_ROUTING_ID: fuehrerscheinstelle
      CREDENTIAL_TYPE: drivers-license

    ports:
      - "127.0.0.1:3004:3004"
      - "127.0.0.1:3005:3005"

    depends_on:
      rabbitmq:
        condition: service_healthy
      issuer:
        condition: service_started

    extra_hosts:
      - "host.docker.internal:host-gateway"

  issuer:
    image: issuer-agent
    build:
      context: ./issuer-agent/
      dockerfile: ../scripts/Dockerfile
      args:
        - DOCKER_BUILDKIT=1

    environment:
      ISSUER_DOMAIN: issuer
      ISSUER_WALLET_ID: Issuer
      ISSUER_SEED: Issuer_0000000000000000000000000
      ISSUER_HTTP_PORT: 3003
      ISSUER_API_PORT: 3002

      VON_URL: http://host.docker.internal:9000
      INDY_NAMESPACE: local:test

      RABBITMQ_URL: amqp://rabbitmq_walletApp:1234@rabbitmq:5672/ssi
      ISSUER_ROUTING_ID: fuehrerscheinstelle
      CREDENTIAL_TYPE: drivers-license

    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:3003:3003"

    depends_on:
      rabbitmq:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ssi-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq_walletApp
      RABBITMQ_DEFAULT_PASS: 1234
      RABBITMQ_DEFAULT_VHOST: ssi

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
  holder-data:
